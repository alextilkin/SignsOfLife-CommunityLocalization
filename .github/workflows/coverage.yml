name: Coverage

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Measure translation coverage
        run: python scripts/measure-coverage.py --write coverage.md --readme README.md --json-out coverage.json
      - name: Publish summary
        if: always()
        run: |
          if [ -f coverage.md ]; then
            cat coverage.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage.md
            coverage.json
      - name: Commit coverage table
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.md README.md
          if git diff --cached --quiet; then
            echo "Coverage table already current."
          else
            git commit -m "Refresh language coverage table."
            git push
          fi
